<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>双生光栅 · 收藏卡</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body><header><a class="brand" href="#">HOLO CARD STUDIO</a><button id="compare">对照原画</button></header><main><section id="stage" tabindex="0" aria-label="拖动卡面查看光栅变化"><div id="loading">载入卡面…</div><div class="hint">左右拖动，换一个形态</div></section><aside><h1 id="card-title">一念神魔</h1><p id="card-description" class="intro">两个完整形态，藏在转动之间。</p><div class="states"><button id="angel" aria-pressed="true">形态 A</button><button id="devil" aria-pressed="false">形态 B</button></div><label>转动 <output id="angleValue">0°</output><input id="angle" type="range" min="-40" max="40" step="0.5" value="0"></label><div class="toolbar"><button id="reset">复位</button><button id="auto">自动</button><button id="back">背面</button><button id="save">保存</button></div><div class="effects"><h2>光效</h2><label>镭射 <output id="foilValue"></output><input id="foil" type="range" min="0" max="1" step="0.01"></label><label>粒子 <output id="particlesValue"></output><input id="particles" type="range" min="0" max="1" step="0.01"></label><label>轮廓光 <output id="glowValue"></output><input id="glow" type="range" min="0" max="1" step="0.01"></label><button id="effects-off">关闭光效</button></div><p class="note">彩色浮世绘水墨<br>完整双卡面 · 随视角切换</p></aside></main><footer><span id="card-edition">HOLO / LENTICULAR</span><span>← → 转动　F 翻面　R 复位</span></footer><dialog id="comparison"><button id="close-compare">关闭</button><div class="pair"><figure><img src="assets/image_a.png" alt="形态 A 完整原画"><figcaption id="caption-a">形态 A</figcaption></figure><figure><img src="assets/image_b.png" alt="形态 B 完整原画"><figcaption id="caption-b">形态 B</figcaption></figure></div></dialog><script type="module" src="app.js"></script></body></html>
