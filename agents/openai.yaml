interface:
  display_name: "Holo Card Studio"
  short_description: "多层镭射卡、双图光栅卡，以及已有全息卡的本机手势交互展示"
  default_prompt: "Use $holo-card-studio to create a finished collectible card project. Use the holographic multilayer route for one artwork, or the two-image lenticular route for 光栅、双形态、and 一念神魔. Default to full-color ukiyo-e with colored sumi-e anime linework, preserve character identity, make good and evil expressions unmistakable, and maximize foil and diamond sparkle while keeping the face readable. When requested, add local webcam gesture presentation to an existing holographic card without regenerating its assets."
